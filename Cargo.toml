[package]
name = "xc16emu-rs"
version = "0.1.0"
edition = "2021"
license = "BSL-1.0"
default-run = "xc16emu"

[dependencies]
minifb = "0.28"
cpal = "0.18.2"

[lib]
name = "xc16emu"
path = "src/lib.rs"

[[bin]]
name = "xc16emu"
path = "src/main.rs"

[[bin]]
name = "font-editor"
path = "src/bin/font-editor.rs"
